<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Trading</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f7;color:#142d2b;font:16px system-ui,sans-serif}.wrap{max-width:760px;margin:7vh auto;padding:24px}.card{background:white;border-radius:18px;padding:28px;box-shadow:0 12px 35px #153b3512}h1{margin:0}p{color:#627875}.balance{background:#e6f6f1;padding:16px;border-radius:12px;font-weight:600}.balance strong{font-size:25px}.row{display:flex;gap:10px;margin:20px 0}select,input,button{font:inherit;padding:12px;border:1px solid #d6e1df;border-radius:10px}input{width:100px}button{border:0;background:#11866d;color:white;font-weight:bold;cursor:pointer}.stock{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid #edf1f0}.muted{color:#70827f}.notice{min-height:24px;color:#11866d}@media(max-width:500px){.row{flex-wrap:wrap}.stock{grid-template-columns:1fr auto}}
</style></head><body><main class="wrap"><section class="card"><h1>Paper Trading</h1><p>A simple stock trading practice game. Prices are fictional and trades are not real.</p><div class="balance">Cash balance<br><strong id="cash">$10,000.00</strong></div><div class="row"><select id="symbol"><option value="NOVA">NOVA · $125</option><option value="PINE">PINE · $84</option><option value="ORBIT">ORBIT · $210</option></select><input id="shares" type="number" min="1" value="1"><button id="buy">Buy shares</button><button id="sell">Sell shares</button></div><div id="notice" class="notice"></div><h3>Your portfolio</h3><div id="portfolio"></div><p class="muted">Prices are fixed sample values. Your progress resets when this page is refreshed.</p></section></main><script>
const prices={NOVA:125,PINE:84,ORBIT:210};let balance=10000,owned={NOVA:0,PINE:0,ORBIT:0};function render(){cash.textContent='$'+balance.toFixed(2);portfolio.innerHTML=Object.keys(prices).map(s=>`<div class="stock"><span><b>${s}</b><br><small class="muted">$${prices[s]} per share</small></span><span>${owned[s]} shares</span><b>$${(owned[s]*prices[s]).toFixed(2)}</b></div>`).join('')}function trade(side){const s=symbol.value,n=Math.floor(Number(shares.value)),cost=n*prices[s];if(!n||n<1){notice.textContent='Enter a number of shares.';return}if(side==='buy'&&cost>balance){notice.textContent='Not enough cash for that trade.';return}if(side==='sell'&&n>owned[s]){notice.textContent='You do not own enough shares.';return}balance+=side==='buy'?-cost:cost;owned[s]+=side==='buy'?n:-n;notice.textContent=`${side==='buy'?'Bought':'Sold'} ${n} ${s} share${n===1?'':'s'}.`;render()}buy.onclick=()=>trade('buy');sell.onclick=()=>trade('sell');render();
</script></body></html>
