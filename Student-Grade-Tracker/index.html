<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Grade Tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font:16px system-ui,sans-serif}.wrap{max-width:760px;margin:7vh auto;padding:24px}.card{background:white;border-radius:18px;padding:28px;box-shadow:0 12px 35px #13264a12}h1{margin:0 0 6px}p{color:#68748a}.row{display:flex;gap:10px;margin:24px 0}input,button{font:inherit;padding:12px;border:1px solid #d8deea;border-radius:10px}input{min-width:0;flex:1}button{border:0;background:#4559d8;color:white;font-weight:700;cursor:pointer}.summary{display:flex;gap:30px;background:#f2f4ff;border-radius:12px;padding:16px}.summary strong{font-size:23px}ul{padding:0;list-style:none}li{display:flex;justify-content:space-between;border-bottom:1px solid #edf0f5;padding:12px 2px;color:#39445a}li button{padding:5px 10px;background:#e95067} @media(max-width:500px){.row{flex-direction:column}.summary{justify-content:space-between;gap:8px}}
</style></head><body><main class="wrap"><section class="card"><h1>Student Grade Tracker</h1><p>Add a subject and score to track your class average.</p><form class="row" id="form"><input id="subject" placeholder="Subject (e.g. Math)" required><input id="score" type="number" placeholder="Score %" min="0" max="100" required><button>Add grade</button></form><div class="summary"><div>Average<br><strong id="average">—</strong></div><div>Overall grade<br><strong id="letter">—</strong></div><div>Subjects<br><strong id="count">0</strong></div></div><ul id="list"></ul></section></main><script>
const grades=[];const letter=n=>n>=90?'A':n>=80?'B':n>=70?'C':n>=60?'D':'F';function render(){list.innerHTML=grades.map((g,i)=>`<li><span>${g.name}</span><span>${g.score}% · ${letter(g.score)} <button type="button" onclick="removeGrade(${i})">Remove</button></span></li>`).join('');count.textContent=grades.length;const avg=grades.length?grades.reduce((s,g)=>s+g.score,0)/grades.length:0;average.textContent=grades.length?avg.toFixed(1)+'%':'—';document.querySelector('#letter').textContent=grades.length?letter(avg):'—'}function removeGrade(i){grades.splice(i,1);render()}form.onsubmit=e=>{e.preventDefault();grades.push({name:subject.value.trim(),score:Number(score.value)});form.reset();render()};
</script></body></html>
