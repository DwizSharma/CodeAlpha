<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friendly Chatbot</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4fb;color:#24233a;font:16px system-ui,sans-serif}.wrap{max-width:680px;margin:7vh auto;padding:24px}.card{background:white;border-radius:18px;padding:26px;box-shadow:0 12px 35px #24233a12}h1{margin:0}p{color:#73728b}.chat{height:340px;overflow:auto;background:#f7f7fc;border-radius:12px;padding:16px;margin:20px 0}.bubble{padding:10px 13px;border-radius:13px;margin:9px 0;max-width:85%;line-height:1.4}.bot{background:#e8e7ff}.user{background:#534bd6;color:white;margin-left:auto}.row{display:flex;gap:8px}input,button{font:inherit;padding:12px;border-radius:10px}input{flex:1;min-width:0;border:1px solid #dcdbea}button{border:0;background:#534bd6;color:white;font-weight:700;cursor:pointer}
</style></head><body><main class="wrap"><section class="card"><h1>Friendly Chatbot</h1><p>A tiny rule based chatbot demo. It works without an API or internet connection.</p><div id="chat" class="chat" aria-live="polite"><div class="bubble bot">Hi! Ask me about my name, the time, or what I can do.</div></div><form id="form" class="row"><input id="message" placeholder="Type a message…" autocomplete="off" required><button>Send</button></form></section></main><script>
function reply(text){const t=text.toLowerCase();if(/\b(hi|hello|hey)\b/.test(t))return 'Hello! Nice to meet you.';if(t.includes('name'))return 'I am Friendly Bot, a small demo chatbot.';if(t.includes('time'))return 'I do not have a live clock, but your device does!';if(t.includes('help')||t.includes('can you'))return 'I can answer a few simple questions about myself.';if(t.includes('thank'))return 'You are welcome!';if(t.includes('bye'))return 'Goodbye. Have a lovely day!';return 'I am still learning. Try saying hello or ask my name.'}form.onsubmit=e=>{e.preventDefault();const text=message.value.trim();if(!text)return;chat.insertAdjacentHTML('beforeend',`<div class="bubble user"></div><div class="bubble bot"></div>`);const bubbles=chat.querySelectorAll('.bubble');bubbles[bubbles.length-2].textContent=text;bubbles[bubbles.length-1].textContent=reply(text);message.value='';chat.scrollTop=chat.scrollHeight};
</script></body></html>
