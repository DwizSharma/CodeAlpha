<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotel Reservation Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f1;color:#302820;font:16px system-ui,sans-serif}.wrap{max-width:740px;margin:7vh auto;padding:24px}.card{background:white;border-radius:18px;padding:28px;box-shadow:0 12px 35px #41351d12}h1{margin:0}p{color:#7b7165}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}label{display:grid;gap:6px;font-weight:600}input,select,button{width:100%;font:inherit;padding:12px;border:1px solid #e2ddd5;border-radius:10px}button{background:#a96831;color:white;border:0;font-weight:700;cursor:pointer}.summary{display:none;background:#faf3e9;padding:18px;border-radius:12px;line-height:1.7}.summary.show{display:block}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="card"><h1>Hotel Reservation</h1><p>Plan a stay and review your reservation details. This demo does not book a real room.</p><form id="form"><div class="grid"><label>Guest name<input id="guest" required placeholder="Your name"></label><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Check-in<input id="checkin" type="date" required></label><label>Check-out<input id="checkout" type="date" required></label><label>Room type<select id="room"><option>Standard · $90/night</option><option>Deluxe · $140/night</option><option>Suite · $220/night</option></select></label><label>Guests<input id="guests" type="number" min="1" max="6" value="1" required></label></div><button>Show reservation summary</button></form><div id="summary" class="summary" aria-live="polite"></div></section></main><script>
form.onsubmit=e=>{e.preventDefault();const start=new Date(checkin.value+'T00:00:00'),end=new Date(checkout.value+'T00:00:00'),n=Math.round((end-start)/86400000);if(n<1){summary.textContent='Check-out must be after check-in.';summary.classList.add('show');return}const rate=Number(room.value.match(/\$(\d+)/)[1]);summary.innerHTML='';const lines=[`Thanks, ${guest.value}! Your sample reservation is ready.`,`Email: ${email.value}`,`Dates: ${checkin.value} to ${checkout.value} (${n} night${n===1?'':'s'})`,`Room: ${room.value}`,`Guests: ${guests.value}`,`Estimated total: $${(rate*n).toFixed(2)}`];for(const line of lines){const div=document.createElement('div');div.textContent=line;summary.append(div)}summary.classList.add('show')};
</script></body></html>
